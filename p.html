<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambil Tautan Anda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2147;--sky:#dcefff;--sun:#ffd54a;--coral:#ff6a55;--mint:#46d9a0;--muted:#565d8a}
*{box-sizing:border-box}
html{background:var(--sky)}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 80% 8%,#fff 0,transparent 38%),var(--sky);overflow-x:hidden}
h1,.go{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif}

/* dekorasi */
.deco{position:fixed;pointer-events:none;z-index:0}
.cloud{width:160px;opacity:.95;animation:drift 45s ease-in-out infinite alternate}
.c1{top:6%;left:-30px}.c2{bottom:8%;right:-40px;width:210px;animation-duration:60s}
.star{width:34px}.s1{top:14%;right:12%}.s2{bottom:16%;left:10%;width:26px}.s3{top:52%;right:5%;width:18px}.s4{top:30%;left:6%;width:20px}
.trail{width:640px;max-width:95vw;top:2%;left:0;opacity:.5}
@keyframes drift{to{transform:translateX(70px)}}

.card{position:relative;z-index:1;width:100%;max-width:440px;background:#fff;border:3px solid var(--ink);border-radius:26px;padding:60px 22px 24px;box-shadow:6px 6px 0 var(--ink);text-align:center}
.badge{position:absolute;top:-44px;left:50%;transform:translateX(-50%);width:88px;height:88px;border:3px solid var(--ink);border-radius:50%;background:var(--sun);display:grid;place-items:center;box-shadow:4px 4px 0 var(--ink)}
.badge svg{width:46px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(4px,-6px) rotate(6deg)}}
h1{margin:0 0 8px;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.sub{margin:0 auto 18px;color:var(--muted);line-height:1.55;max-width:34ch}

.notice{display:flex;gap:12px;align-items:flex-start;text-align:left;margin-bottom:20px;padding:14px;border:2px solid var(--ink);border-radius:16px;background:#fff6cc}
.notice i{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;background:var(--sun);display:grid;place-items:center;font:800 15px Figtree,sans-serif}
.notice p{margin:0;line-height:1.5;font-weight:500}

.go{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;font-size:19px;font-weight:800;color:var(--ink);background:var(--coral);border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s}
.go:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.go:active:not(:disabled){transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.go:disabled{opacity:.6;cursor:not-allowed}
.go:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.spin{display:none;width:20px;height:20px;border:3px solid var(--ink);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.go.loading .spin{display:block}
@keyframes spin{to{transform:rotate(1turn)}}

#error{min-height:20px;margin:12px 0 0;font-weight:600;color:#c0301f}
.privacy{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.cloud,.badge svg,.spin{animation:none}.go{transition:none}}
</style>
</head>
<body>

<!-- dekorasi latar -->
<svg class="deco cloud c1" viewBox="0 0 140 70" aria-hidden="true"><g fill="#fff"><circle cx="40" cy="42" r="22"/><circle cx="70" cy="30" r="28"/><circle cx="102" cy="42" r="22"/><rect x="40" y="42" width="62" height="22" rx="11"/></g></svg>
<svg class="deco cloud c2" viewBox="0 0 140 70" aria-hidden="true"><g fill="#fff"><circle cx="40" cy="42" r="22"/><circle cx="70" cy="30" r="28"/><circle cx="102" cy="42" r="22"/><rect x="40" y="42" width="62" height="22" rx="11"/></g></svg>
<svg class="deco star s1" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2c1 10 8 17 18 18-10 1-17 8-18 18-1-10-8-17-18-18 10-1 17-8 18-18z" fill="#ffd54a" stroke="#1d2147" stroke-width="2.5" stroke-linejoin="round"/></svg>
<svg class="deco star s2" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2c1 10 8 17 18 18-10 1-17 8-18 18-1-10-8-17-18-18 10-1 17-8 18-18z" fill="#46d9a0" stroke="#1d2147" stroke-width="2.5" stroke-linejoin="round"/></svg>
<svg class="deco star s3" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2c1 10 8 17 18 18-10 1-17 8-18 18-1-10-8-17-18-18 10-1 17-8 18-18z" fill="#ff6a55" stroke="#1d2147" stroke-width="2.5" stroke-linejoin="round"/></svg>
<svg class="deco star s4" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2c1 10 8 17 18 18-10 1-17 8-18 18-1-10-8-17-18-18 10-1 17-8 18-18z" fill="#fff" stroke="#1d2147" stroke-width="2.5" stroke-linejoin="round"/></svg>
<svg class="deco trail" viewBox="0 0 600 200" aria-hidden="true"><path d="M0 40C120 10 180 150 320 120S520 30 600 150" fill="none" stroke="#1d2147" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/></svg>

<main class="card">
  <div class="badge"><svg viewBox="0 0 60 60" aria-hidden="true"><path d="M4 30L56 5 40 56 30 36z" fill="#fff" stroke="#1d2147" stroke-width="4" stroke-linejoin="round"/><path d="M56 5L30 36" stroke="#1d2147" stroke-width="4" stroke-linecap="round"/></svg></div>

  <h1>Tautan Anda siap diambil</h1>
  <p class="sub" id="info">Tekan tombol di bawah untuk melanjutkan ke tujuan Anda.</p>

  <div class="notice">
    <i aria-hidden="true">i</i>
    <p>Lewati link ini terlebih dahulu untuk bisa mendapatkan direct link pada link download mods selanjutnya🥰.</p>
  </div>

  <button class="go loading" id="btn" type="button" disabled>
    <span class="spin" aria-hidden="true"></span>
    <span id="btnText">Memeriksa tautan...</span>
  </button>
  <p id="error" role="alert"></p>

  <p class="privacy">Untuk menentukan tautan yang Anda terima, kami mencatat alamat IP dan ID perangkat Anda.</p>
</main>

<script type="module">
import { db } from "/firebase.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const WINDOW_MS = 20 * 60 * 60 * 1000;

const btn = document.getElementById("btn");
const btnText = document.getElementById("btnText");
const info = document.getElementById("info");
const errEl = document.getElementById("error");

const linkId =
  location.pathname.match(/^\/d\/([^/]+)/)?.[1] ||
  new URLSearchParams(location.search).get("id");

let linkData = null;

function setReady() {
  btn.classList.remove("loading");
  btn.disabled = false;
  btnText.textContent = "Lanjutkan";
}

function showError(msg) {
  errEl.textContent = msg;
  info.textContent = "";
  btn.classList.remove("loading");
  btn.disabled = true;
  btnText.textContent = "Tidak tersedia";
}

// Hanya izinkan http/https agar tidak ada redirect berbahaya
const safeUrl = u => { try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:"; } catch { return false; } };

// ID perangkat: localStorage, lalu cookie, lalu buat baru
function getDeviceId() {
  let id = null;
  try { id = localStorage.getItem("device_id"); } catch {}
  if (!id) {
    const m = document.cookie.match(/(?:^|; )device_id=([^;]+)/);
    id = m ? decodeURIComponent(m[1]) : crypto.randomUUID();
  }
  try { localStorage.setItem("device_id", id); } catch {}
  document.cookie = `device_id=${encodeURIComponent(id)}; max-age=31536000; path=/; SameSite=Lax`;
  return id;
}

// IP publik dari layanan luar, timeout 4 detik
async function getIp() {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    const res = await fetch("https://api.ipify.org?format=json", { signal: ctrl.signal });
    clearTimeout(timer);
    return (await res.json()).ip || null;
  } catch {
    return null;
  }
}

async function decideLink(deviceId, ip) {
  const now = Date.now();
  const devKey = "dev_" + deviceId;
  const ipKey = ip ? "ip_" + ip.replace(/[^a-zA-Z0-9]/g, "_") : null;
  const keys = ipKey ? [devKey, ipKey] : [devKey];

  const snaps = await Promise.all(keys.map(k => getDoc(doc(db, "visitors", k))));

  // Sudah lolos verifikasi (move2link) dalam 24 jam terakhir: berikan Link 2
  const verified = snaps.some(s => {
    const t = s.exists() ? s.data().verifiedAt : null;
    return t && now - t < WINDOW_MS;
  });
  if (verified) return linkData.link2;

  // Belum terverifikasi: tandai "menunggu verifikasi" lalu berikan Link 1
  const payload = { pendingAt: now, ip: ip ?? null, deviceId };
  await Promise.all(keys.map(k => setDoc(doc(db, "visitors", k), payload, { merge: true })));
  return linkData.link1;
}

async function init() {
  if (!linkId) return showError("Tautan tidak valid. Periksa kembali alamat yang Anda buka.");
  try {
    const snap = await getDoc(doc(db, "links", linkId));
    if (!snap.exists()) return showError("Tautan tidak ditemukan. Minta tautan baru dari pengirimnya.");
    linkData = snap.data();
    if (!safeUrl(linkData.link1) || !safeUrl(linkData.link2)) return showError("Tujuan tautan tidak valid.");
    setReady();
  } catch (err) {
    console.error(err);
    showError("Gagal memuat tautan. Muat ulang halaman ini.");
  }
}

btn.addEventListener("click", async () => {
  btn.disabled = true;
  btn.classList.add("loading");
  btnText.textContent = "Memproses...";
  errEl.textContent = "";

  try {
    const target = await decideLink(getDeviceId(), await getIp());
    window.location.href = target;
  } catch (err) {
    console.error(err);
    errEl.textContent = "Terjadi kesalahan. Klik Lanjutkan untuk mencoba lagi.";
    setReady();
  }
});

init();
</script>
</body>
</html>
